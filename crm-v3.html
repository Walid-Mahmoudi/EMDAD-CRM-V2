<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMDAD CRM V3</title>

<style>
:root{--red:#c83535;--dark:#17202a;--bg:#f4f6f8;--muted:#6b7280;--line:#e5e7eb;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:var(--dark)}button{border:0;border-radius:9px;padding:10px 14px;background:var(--red);color:#fff;cursor:pointer;font-weight:700}button.secondary{background:#eef0f2;color:var(--dark)}button.danger{background:#7f1d1d}.top{background:var(--dark);color:#fff;padding:15px 22px;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;z-index:5}.brand{font-size:20px;font-weight:800}.top small{opacity:.75}.wrap{max-width:1450px;margin:auto;padding:18px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.nav button{background:#fff;color:var(--dark);border:1px solid var(--line)}.nav button.on{background:var(--dark);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}.kpi small{color:var(--muted)}.kpi h2{margin:8px 0 0;font-size:25px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar>*{max-width:220px}input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;background:#fff;font:inherit}textarea{min-height:90px;resize:vertical}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.full{grid-column:1/-1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px;border-bottom:1px solid var(--line);font-size:13px;text-align:right;vertical-align:top}th{background:#f8fafc;white-space:nowrap}.click{cursor:pointer}.click:hover{background:#fafafa}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef0f2;font-size:11px}.badge.red{background:#fee2e2;color:#991b1b}.badge.green{background:#dcfce7;color:#166534}.badge.blue{background:#dbeafe;color:#1e40af}.muted{color:var(--muted)}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px;z-index:20}.modalbox{background:#fff;border-radius:16px;width:min(1100px,96vw);max-height:92vh;overflow:auto;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.tabs{display:flex;gap:7px;overflow:auto;margin:15px 0}.tabs button{background:#fff;color:var(--dark);border:1px solid var(--line);white-space:nowrap}.tabs button.on{background:var(--dark);color:#fff}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:10px}.timeline{border-right:3px solid #e5e7eb;padding-right:15px}.event{position:relative;padding:0 0 14px}.event:before{content:'';position:absolute;right:-24px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--red)}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(440px,96vw)}.error{color:#b91c1c;background:#fef2f2;padding:10px;border-radius:8px;margin:10px 0}.success{color:#166534;background:#f0fdf4;padding:10px;border-radius:8px;margin:10px 0}.hint{font-size:12px;color:var(--muted);margin-top:4px}.pillrow{display:flex;gap:6px;flex-wrap:wrap}.right{margin-right:auto}.money{font-variant-numeric:tabular-nums;font-weight:700}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid,.grid2{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.top{padding:12px}}
</style></head>
<body>
<div id="auth" class="auth"><div class="authbox card">
<h1>EMDAD CRM</h1><p class="muted">Sales • Technical • Projects • Collections</p>
<div id="authMsg"></div><label>Email</label><input id="aEmail" type="email" autocomplete="email"><label>Password</label><input id="aPass" type="password" autocomplete="current-password"><div style="margin-top:14px" class="toolbar"><button onclick="signIn()">تسجيل الدخول</button><button class="secondary" onclick="signUp()">إنشاء حساب</button></div><p class="hint">الحساب الجديد يحتاج Profile/Role مناسب قبل استخدام صلاحيات الفريق.</p>
</div></div>
<div id="app" class="hidden"><header class="top"><div><div class="brand">EMDAD CRM V3</div><small id="who"></small></div><button class="secondary" onclick="signOut()">خروج</button></header>
<main class="wrap"><div id="nav" class="nav"></div><div id="page"></div></main></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle"></h2><button class="secondary" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const SB_URL='https://quprtdxhjfmiodbjvrsq.supabase.co';const SB_KEY='sb_publishable_f3GJikH0CSBrX_jNIvJI6A_-oCJByhX';const db=window.supabase.createClient(SB_URL,SB_KEY);let user=null,me=null,state={page:'dashboard',project:null,companies:[],contacts:[],profiles:[]};
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=x=>new Intl.NumberFormat('en-EG').format(Number(x||0));const dt=x=>x?new Date(x).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}):'—';const d=x=>x?new Date(x).toLocaleDateString('en-GB'):'—';
const projectTypes={tender_in_market:'Tender in Market',in_hand:'In Hand',official_tender:'Official Tender'};const statuses={new:'New',rfq_received:'RFQ Received',sent_to_technical:'Sent to Technical',technical_pricing:'Technical Pricing',pricing_completed:'Pricing Completed',quotation_sent:'Quotation Sent',follow_up:'Follow Up',negotiation:'Negotiation',won:'Won',lost:'Lost',cancelled:'Cancelled'};const reqStatuses={pending:'Pending',in_progress:'In Progress',completed:'Completed',returned_for_revision:'Returned for Revision',cancelled:'Cancelled'};
function canEdit(){return ['admin','sales','technical_support','management'].includes(me?.role)}function isAdmin(){return me?.role==='admin'}function nav(){let items=[['dashboard','Dashboard'],['projects','Projects'],['companies','Customers'],['followups','Follow-ups'],['meetings','Meetings']];$('nav').innerHTML=items.map(([k,v])=>`<button class="${state.page===k?'on':''}" onclick="go('${k}')">${v}</button>`).join('')}
function go(p){state.page=p;nav();({dashboard:dashboard,projects:projects,companies:companiesPage,followups:followupsPage,meetings:meetingsPage}[p]||dashboard)()}
async function signIn(){msg('');let {data,error}=await db.auth.signInWithPassword({email:$('aEmail').value.trim(),password:$('aPass').value});if(error)return msg(error.message,true);await boot(data.user)}async function signUp(){msg('');let email=$('aEmail').value.trim(),password=$('aPass').value;if(!email||password.length<6)return msg('أدخل Email وكلمة مرور 6 أحرف على الأقل',true);let {data,error}=await db.auth.signUp({email,password});if(error)return msg(error.message,true);msg(data.session?'تم إنشاء الحساب وتسجيل الدخول.':'تم إنشاء الحساب. لو Email Confirmation مفعّل، أكد البريد ثم سجّل الدخول.')}function msg(t,bad=false){$('authMsg').innerHTML=t?`<div class="${bad?'error':'success'}">${esc(t)}</div>`:''}
async function boot(u){user=u;$('auth').classList.add('hidden');$('app').classList.remove('hidden');let r=await db.from('profiles').select('*').eq('id',u.id).maybeSingle();me=r.data||{id:u.id,full_name:u.email,role:'sales'};$('who').textContent=`${me.full_name||u.email} • ${me.role}`;nav();go('dashboard')}async function signOut(){await db.auth.signOut();location.reload()}
async function getProfiles(){let {data}=await db.from('profiles').select('id,full_name,role,is_active').eq('is_active',true).order('full_name');return data||[]}
async function dashboard(){state.profiles=await getProfiles();let [p,c,f]=await Promise.all([db.from('projects').select('id,name,project_type,status,estimated_value,contract_value,sales_owner_id,created_at'),db.from('collections').select('project_id,amount,collection_date'),db.from('follow_ups').select('id,project_id,follow_up_date,next_action_date,result')]);let ps=p.data||[],cs=c.data||[],fs=f.data||[];let open=ps.filter(x=>!['won','lost','cancelled'].includes(x.status));let sum=(a,k)=>a.reduce((s,x)=>s+Number(x[k]||0),0);let collected=sum(cs,'amount'),won=sum(ps.filter(x=>x.status==='won'),'contract_value');$('page').innerHTML=`<div class="toolbar" style="margin-bottom:12px"><h2 style="margin:0">Dashboard</h2><span class="right"></span><button onclick="newProject()">+ مشروع جديد</button></div><div class="card"><div class="formgrid"><div><label>من تاريخ</label><input id="df" type="date" onchange="dashboardFilter()"></div><div><label>إلى تاريخ</label><input id="dt" type="date" onchange="dashboardFilter()"></div><div><label>نوع المشروع</label><select id="dpt" onchange="dashboardFilter()"><option value="">كل الأنواع</option>${Object.entries(projectTypes).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div><label>Sales Owner</label><select id="do" onchange="dashboardFilter()"><option value="">الكل</option>${state.profiles.filter(x=>['sales','admin','management'].includes(x.role)).map(x=>`<option value="${x.id}">${esc(x.full_name)}</option>`).join('')}</select></div></div></div><div id="kpis" class="grid"></div><div class="card"><div class="sectionTitle"><h3>Follow-ups تحتاج انتباه</h3><button class="secondary" onclick="go('followups')">فتح الكل</button></div><div class="tablewrap"><table><tr><th>Project</th><th>Follow-up</th><th>Next Action</th><th>Result</th></tr>${fs.filter(x=>x.next_action_date&&new Date(x.next_action_date)<new Date()).slice(0,8).map(x=>`<tr><td>${esc(x.project_id)}</td><td>${dt(x.follow_up_date)}</td><td>${dt(x.next_action_date)}</td><td>${esc(x.result)}</td></tr>`).join('')||'<tr><td colspan="4">لا يوجد متأخر</td></tr>'}</table></div></div>`;window._dash={ps,cs,fs};dashboardFilter()}
function dashboardFilter(){let x=window._dash;if(!x)return;let from=$('df').value?new Date($('df').value+'T00:00:00'):null,to=$('dt').value?new Date($('dt').value+'T23:59:59'):null,typ=$('dpt').value,own=$('do').value;let ps=x.ps.filter(p=>(!from||new Date(p.created_at)>=from)&&(!to||new Date(p.created_at)<=to)&&(!typ||p.project_type===typ)&&(!own||p.sales_owner_id===own));let open=ps.filter(p=>!['won','lost','cancelled'].includes(p.status));let sum=(a,k)=>a.reduce((s,r)=>s+Number(r[k]||0),0),won=ps.filter(p=>p.status==='won');let cs=x.cs.filter(c=>(!from||new Date(c.collection_date)>=from)&&(!to||new Date(c.collection_date)<=to));$('kpis').innerHTML=`${k('Total Estimated Pipeline',sum(open,'estimated_value'))}${k('In Hand Pipeline',sum(open.filter(p=>p.project_type==='in_hand'),'estimated_value'))}${k('Tender in Market',sum(open.filter(p=>p.project_type==='tender_in_market'),'estimated_value'))}${k('Official Tender',sum(open.filter(p=>p.project_type==='official_tender'),'estimated_value'))}${k('Total Won / Contracted',sum(won,'contract_value'))}${k('Total Collected',sum(cs,'amount'))}${k('Remaining to Collect',sum(won,'contract_value')-sum(x.cs.filter(c=>won.some(p=>p.id===c.project_id)),'amount'))}${k('Open Projects',open.length,true)}`};function k(t,v,count=false){return `<div class="card kpi"><small>${t}</small><h2>${count?v:money(v)+' EGP'}</h2></div>`}
async function projects(){let {data,error}=await db.from('projects').select('*,companies(name),sales:profiles!projects_sales_owner_id_fkey(full_name)').order('created_at',{ascending:false});if(error)return pageError(error);$('page').innerHTML=`<div class="toolbar"><h2>Projects</h2><span class="right"></span><input id="psearch" placeholder="بحث بالمشروع/الكود/الشركة" oninput="filterProjects()"><select id="pstatus" onchange="filterProjects()"><option value="">كل الحالات</option>${Object.entries(statuses).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><button onclick="newProject()">+ مشروع جديد</button></div><div class="card"><div class="tablewrap"><table id="ptable"><tr><th>Code</th><th>Project</th><th>Customer</th><th>Type</th><th>Status</th><th>Estimated</th><th>Contract</th><th>Owner</th></tr>${(data||[]).map(p=>`<tr class="click prow" data-s="${esc((p.name+' '+p.project_code+' '+(p.companies?.name||'')).toLowerCase())}" data-status="${p.status}" onclick="openProject('${p.id}')"><td>${esc(p.project_code)}</td><td>${esc(p.name)}</td><td>${esc(p.companies?.name)}</td><td>${projectTypes[p.project_type]}</td><td>${statusBadge(p.status)}</td><td class="money">${money(p.estimated_value)}</td><td class="money">${money(p.contract_value)}</td><td>${esc(p.sales?.full_name)}</td></tr>`).join('')}</table></div></div>`}
function filterProjects(){let q=($('psearch').value||'').toLowerCase(),s=$('pstatus').value;document.querySelectorAll('.prow').forEach(r=>r.style.display=(!q||r.dataset.s.includes(q))&&(!s||r.dataset.status===s)?'':'none')}
function statusBadge(s){let c=s==='won'?'green':s==='lost'||s==='cancelled'?'red':s==='quotation_sent'||s==='negotiation'?'blue':'';return `<span class="badge ${c}">${statuses[s]||s}</span>`}
async function loadCompanies(){let {data}=await db.from('companies').select('*').order('name');state.companies=data||[];return state.companies}async function loadContacts(cid){let q=db.from('contacts').select('*').order('name');if(cid)q=q.eq('company_id',cid);let {data}=await q;state.contacts=data||[];return state.contacts}
async function companiesPage(){let cs=await loadCompanies();$('page').innerHTML=`<div class="toolbar"><h2>Customers & Contacts</h2><span class="right"></span><button onclick="newCompany()">+ Customer</button></div><div class="card"><div class="tablewrap"><table><tr><th>Company</th><th>Type</th><th>Industry</th><th>City</th><th>Phone</th><th>Contacts</th><th></th></tr>${cs.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.customer_type==='existing'?'Existing':'New'}</td><td>${esc(c.industry)}</td><td>${esc(c.city)}</td><td>${esc(c.phone)}</td><td><button class="secondary" onclick="contacts('${c.id}')">Contacts</button></td><td><button onclick="editCompany('${c.id}')">Edit</button></td></tr>`).join('')}</table></div></div>`}
function companyForm(c={}){return `<div class="formgrid"><div><label>Company Name *</label><input id="cn" value="${esc(c.name)}"></div><div><label>Customer Type</label><select id="ct"><option value="new" ${c.customer_type==='new'?'selected':''}>New Customer</option><option value="existing" ${c.customer_type==='existing'?'selected':''}>Existing Customer</option></select></div><div><label>Industry</label><input id="ci" value="${esc(c.industry)}"></div><div><label>City</label><input id="ccity" value="${esc(c.city)}"></div><div><label>Phone</label><input id="cphone" value="${esc(c.phone)}"></div><div><label>Email</label><input id="cemail" value="${esc(c.email)}"></div><div><label>Website</label><input id="cweb" value="${esc(c.website)}"></div><div><label>Address</label><input id="caddr" value="${esc(c.address)}"></div><div class="full"><label>Notes</label><textarea id="cnotes">${esc(c.notes)}</textarea></div></div>`}
async function newCompany(){openModal('New Customer',companyForm()+`<br><button onclick="saveCompany()">Save</button>`)}async function editCompany(id){let c=state.companies.find(x=>x.id===id)|| (await db.from('companies').select('*').eq('id',id).single()).data;openModal('Edit Customer',companyForm(c)+`<br><button onclick="saveCompany('${id}')">Save</button>`)}async function saveCompany(id){let q={name:$('cn').value.trim(),customer_type:$('ct').value,industry:$('ci').value,city:$('ccity').value,phone:$('cphone').value,email:$('cemail').value,website:$('cweb').value,address:$('caddr').value,notes:$('cnotes').value};if(!q.name)return alert('Company name required');let r=id?await db.from('companies').update(q).eq('id',id):await db.from('companies').insert({...q,created_by:user.id});if(r.error)return alert(r.error.message);closeModal();companiesPage()}
async function contacts(cid){let c=state.companies.find(x=>x.id===cid),rows=await loadContacts(cid);openModal(`Contacts — ${esc(c?.name||'')}`,`<div class="toolbar"><button onclick="newContact('${cid}')">+ Contact</button></div><div class="tablewrap"><table><tr><th>Name</th><th>Job Title</th><th>Phone</th><th>WhatsApp</th><th>Email</th><th>Primary</th><th></th></tr>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.job_title)}</td><td>${esc(x.phone)}</td><td>${esc(x.whatsapp)}</td><td>${esc(x.email)}</td><td>${x.is_primary?'✓':''}</td><td><button onclick="editContact('${x.id}','${cid}')">Edit</button></td></tr>`).join('')}</table></div>`)}function contactForm(x={}){return `<div class="formgrid"><div><label>Name *</label><input id="n" value="${esc(x.name)}"></div><div><label>Job Title</label><input id="jt" value="${esc(x.job_title)}"></div><div><label>Phone</label><input id="ph" value="${esc(x.phone)}"></div><div><label>WhatsApp</label><input id="wa" value="${esc(x.whatsapp)}"></div><div><label>Email</label><input id="em" value="${esc(x.email)}"></div><div><label>Primary</label><select id="ip"><option value="false">No</option><option value="true" ${x.is_primary?'selected':''}>Yes</option></select></div><div class="full"><label>Notes</label><textarea id="nn">${esc(x.notes)}</textarea></div></div>`}function newContact(cid){openModal('New Contact',contactForm()+`<br><button onclick="saveContact(null,'${cid}')">Save</button>`)}async function editContact(id,cid){let x=state.contacts.find(v=>v.id===id);openModal('Edit Contact',contactForm(x)+`<br><button onclick="saveContact('${id}','${cid}')">Save</button>`)}async function saveContact(id,cid){let q={company_id:cid,name:$('n').value.trim(),job_title:$('jt').value,phone:$('ph').value,whatsapp:$('wa').value,email:$('em').value,is_primary:$('ip').value==='true',notes:$('nn').value};if(!q.name)return alert('Contact name required');let r=id?await db.from('contacts').update(q).eq('id',id):await db.from('contacts').insert(q);if(r.error)return alert(r.error.message);contacts(cid)}
async function newProject(){let cs=await loadCompanies(),ps=await getProfiles();openModal('New Project',`<div class="hint">قاعدة مالية: عند إنشاء المشروع لا ندخل Estimated Value ولا Contract Value. Estimated Value يظهر بعد اكتمال التسعير، وContract Value بعد Won فقط.</div><div class="formgrid"><div><label>Project Name *</label><input id="pn"></div><div><label>Customer *</label><select id="pc"><option value="">اختر</option>${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div><label>Contact</label><select id="pcontact"><option value="">اختر Customer أولاً</option></select></div><div><label>Sales Owner</label><select id="po">${ps.filter(x=>['sales','admin','management'].includes(x.role)).map(x=>`<option value="${x.id}" ${x.id===user.id?'selected':''}>${esc(x.full_name)}</option>`).join('')}</select></div><div><label>Project Type *</label><select id="pty">${Object.entries(projectTypes).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div><label>Status</label><select id="pst">${Object.entries(statuses).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div><label>Win Probability %</label><input id="wp" type="number" min="0" max="100" value="0"></div><div><label>Expected Start</label><input id="es" type="date"></div><div class="full"><label>Notes</label><textarea id="pnotes"></textarea></div></div><br><button onclick="saveProject()">Create Project</button>`);$('pc').onchange=async()=>{let rows=await loadContacts($('pc').value);$('pcontact').innerHTML='<option value="">—</option>'+rows.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')};}
async function saveProject(){let q={name:$('pn').value.trim(),company_id:$('pc').value,contact_id:$('pcontact').value||null,sales_owner_id:$('po').value||null,project_type:$('pty').value,status:$('pst').value,win_probability:Number($('wp').value||0),expected_start:$('es').value||null,notes:$('pnotes').value,created_by:user.id,estimated_value:null,contract_value:null};if(!q.name||!q.company_id)return alert('Project Name و Customer مطلوبان');let r=await db.from('projects').insert(q).select().single();if(r.error)return alert(r.error.message);closeModal();openProject(r.data.id)}
async function openProject(id){let {data:p,error}=await db.from('projects').select('*,companies(name),contacts(name,job_title,phone,whatsapp,email),sales:profiles!projects_sales_owner_id_fkey(full_name),technical:profiles!projects_technical_owner_id_fkey(full_name)').eq('id',id).single();if(error)return alert(error.message);state.project=p;openModal(p.name,projectView(p));projectTab('overview',document.querySelector('.tabs button'))}
function projectView(p){return `<div class="pillrow"><span class="badge">${esc(p.project_code)}</span><span class="badge">${projectTypes[p.project_type]}</span>${statusBadge(p.status)}<span class="badge">Probability ${p.win_probability||0}%</span></div><div class="grid2" style="margin-top:12px"><div class="card"><b>Customer</b><p>${esc(p.companies?.name)}</p><small>${esc(p.contacts?.name||'—')} ${esc(p.contacts?.job_title||'')}</small></div><div class="card"><b>Financials</b><p>Estimated: <span class="money">${money(p.estimated_value)} EGP</span></p><p>Contract: <span class="money">${money(p.contract_value)} EGP</span></p><p>Remaining: <span id="remainingBox">calculating…</span></p></div></div><div class="tabs">${[['overview','Overview'],['technical','Technical'],['quotes','Quotations'],['followups','Follow-ups'],['meetings','Meetings'],['updates','Updates'],['docs','Documents'],['collections','Collections']].map((x,i)=>`<button onclick="projectTab('${x[0]}',this)" class="${i===0?'on':''}">${x[1]}</button>`).join('')}</div><div id="projectBody"></div>`}
async function projectTab(t,b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));if(b)b.classList.add('on');let p=state.project;if(t==='overview')return overviewTab();if(t==='technical')return listChild('technical_requests','Technical Requests',['requested_at','subject','status','priority','assigned_to','pricing_value','completed_at'],true);if(t==='quotes')return listChild('quotations','Quotations',['quotation_date','version_no','quotation_number','quotation_type','value','status','sent_at'],true);if(t==='followups')return listChild('follow_ups','Follow-ups',['follow_up_date','follow_up_type','result','next_action','next_action_date','responsible_id'],true);if(t==='meetings')return listChild('meetings','Meetings',['meeting_date','title','meeting_type','location','outcome','next_action'],true);if(t==='updates')return listChild('project_updates','Updates / Revisions',['created_at','update_type','title','details'],true);if(t==='collections')return collectionsTab();if(t==='docs')return docsTab()}
async function overviewTab(){let [u,m]=await Promise.all([db.from('project_updates').select('*').eq('project_id',state.project.id).order('created_at',{ascending:false}),db.from('meetings').select('*').eq('project_id',state.project.id).order('meeting_date',{ascending:false})]);let events=[...(u.data||[]).map(x=>({at:x.created_at,title:x.title,body:x.details,type:x.update_type})),...(m.data||[]).map(x=>({at:x.meeting_date,title:x.title,body:x.outcome,type:'Meeting'}))].sort((a,b)=>new Date(b.at)-new Date(a.at));$('projectBody').innerHTML=`<div class="sectionTitle"><h3>Activity Timeline</h3><button onclick="editProject()">Edit Project</button></div><div class="card"><p><b>Sales Owner:</b> ${esc(state.project.sales?.full_name||'—')} &nbsp; <b>Technical:</b> ${esc(state.project.technical?.full_name||'—')}</p><p>${esc(state.project.notes||'No notes')}</p></div><div class="timeline">${events.map(e=>`<div class="event"><b>${esc(e.title)}</b> <span class="badge">${esc(e.type)}</span><div class="muted">${dt(e.at)}</div><p>${esc(e.body||'')}</p></div>`).join('')||'<p class="muted">No activity yet.</p>'}</div>`;if($('remainingBox'))remaining()}
async function remaining(){let {data}=await db.from('collections').select('amount').eq('project_id',state.project.id);let r=Number(state.project.contract_value||0)-(data||[]).reduce((s,x)=>s+Number(x.amount||0),0);$('remainingBox').textContent=money(r)+' EGP'}
async function editProject(){let p=state.project,ps=await getProfiles();let pricing=['pricing_completed','quotation_sent','follow_up','negotiation','won','lost'].includes(p.status);let won=p.status==='won';openModal('Edit Project',`<div class="hint">Estimated Value لا يُسمح به قبل اكتمال التسعير. Contract Value لا يُسمح به إلا في Won.</div><div class="formgrid"><div><label>Project Name</label><input id="en" value="${esc(p.name)}"></div><div><label>Status</label><select id="esx">${Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${p.status===k?'selected':''}>${v}</option>`).join('')}</select></div><div><label>Win Probability %</label><input id="ew" type="number" min="0" max="100" value="${p.win_probability||0}"></div><div><label>Technical Owner</label><select id="eto"><option value="">—</option>${ps.filter(x=>x.role==='technical_support'||x.role==='admin').map(x=>`<option value="${x.id}" ${p.technical_owner_id===x.id?'selected':''}>${esc(x.full_name)}</option>`).join('')}</select></div><div><label>Estimated Value ${pricing?'':'(locked)'}</label><input id="ee" type="number" ${pricing?'':'disabled'} value="${p.estimated_value??''}"></div><div><label>Contract Value ${won?'':'(Won only)'}</label><input id="ec" type="number" ${won?'':'disabled'} value="${p.contract_value??''}"></div><div><label>Contract Date</label><input id="ecd" type="date" value="${p.contract_date||''}"></div><div><label>Expected Start</label><input id="ees" type="date" value="${p.expected_start||''}"></div><div class="full"><label>Lost Reason</label><select id="el"><option value="">—</option>${['Price','Competitor','Client Cancelled','Project Cancelled','Technical','No Response','Other'].map(x=>`<option ${p.lost_reason===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="full"><label>Notes</label><textarea id="enotes">${esc(p.notes)}</textarea></div></div><br><button onclick="saveEditProject()">Save Changes</button>`)}
async function saveEditProject(){let status=$('esx').value,q={name:$('en').value.trim(),status,win_probability:Number($('ew').value||0),technical_owner_id:$('eto').value||null,estimated_value:$('ee').disabled?null:Number($('ee').value||0),contract_value:$('ec').disabled?null:Number($('ec').value||0),contract_date:$('ecd').value||null,expected_start:$('ees').value||null,lost_reason:status==='lost'?$('el').value:null,notes:$('enotes').value};if(status==='won'&&!q.contract_value)return alert('Contract Value مطلوب عند Won');if(status!=='won')q.contract_value=null;if(!['pricing_completed','quotation_sent','follow_up','negotiation','won','lost'].includes(status))q.estimated_value=null;let r=await db.from('projects').update(q).eq('id',state.project.id);if(r.error)return alert(r.error.message);closeModal();openProject(state.project.id)}
async function listChild(table,title,cols,addable){let q=db.from(table).select('*').eq('project_id',state.project.id);let order=cols[0];let {data,error}=await q.order(order,{ascending:false});if(error)return $('projectBody').innerHTML=`<div class="error">${esc(error.message)}</div>`;let names=state.profiles.length?state.profiles:await getProfiles();$('projectBody').innerHTML=`<div class="sectionTitle"><h3>${title}</h3><button onclick="addChild('${table}')">+ Add</button></div><div class="tablewrap"><table><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${(data||[]).map(x=>`<tr>${cols.map(c=>`<td>${c.includes('_at')?dt(x[c]):c==='status'?statusBadge(x[c]):c.endsWith('_id')?esc(names.find(n=>n.id===x[c])?.full_name||x[c]):c==='value'||c==='pricing_value'||c==='amount'?money(x[c]):esc(x[c])}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="20">No records.</td></tr>'}</table></div>`}
async function addChild(table){let p=state.project,ps=state.profiles.length?state.profiles:await getProfiles();let html='';if(table==='technical_requests')html=`<div class="formgrid"><div><label>Subject</label><input id="x1"></div><div><label>Priority</label><select id="x2"><option>normal</option><option>high</option><option>urgent</option></select></div><div><label>Assign Technical</label><select id="x3"><option value="">—</option>${ps.filter(x=>x.role==='technical_support'||x.role==='admin').map(x=>`<option value="${x.id}">${esc(x.full_name)}</option>`).join('')}</select></div><div><label>Status</label><select id="x4"><option>pending</option><option>in_progress</option></select></div><div class="full"><label>Scope / BOQ Notes</label><textarea id="x5"></textarea></div></div>`;else if(table==='quotations')html=`<div class="formgrid"><div><label>Quotation Number</label><input id="x1"></div><div><label>Quotation Type</label><select id="x2"><option>commercial</option><option>technical</option><option>revised</option></select></div><div><label>Value *</label><input id="x3" type="number"></div><div><label>Status</label><select id="x4"><option>draft</option><option>sent</option><option>revised</option><option>accepted</option><option>rejected</option><option>superseded</option></select></div><div><label>Sent At</label><input id="x5" type="datetime-local"></div><div class="full"><label>Notes</label><textarea id="x6"></textarea></div></div>`;else if(table==='follow_ups')html=`<div class="formgrid"><div><label>Date</label><input id="x1" type="datetime-local"></div><div><label>Type</label><select id="x2">${['phone_call','whatsapp','email','meeting','site_visit','online_meeting','other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="full"><label>Result</label><textarea id="x3"></textarea></div><div><label>Next Action</label><input id="x4"></div><div><label>Next Action Date</label><input id="x5" type="datetime-local"></div></div>`;else if(table==='meetings')html=`<div class="formgrid"><div><label>Meeting Date</label><input id="x1" type="datetime-local"></div><div><label>Title</label><input id="x2"></div><div><label>Meeting Type</label><select id="x3"><option>project_meeting</option><option>client_meeting</option><option>online_meeting</option><option>site_visit</option></select></div><div><label>Location</label><input id="x4"></div><div class="full"><label>Attendees</label><input id="x5"></div><div class="full"><label>Outcome</label><textarea id="x6"></textarea></div><div class="full"><label>Next Action</label><input id="x7"></div><div><label>Next Action Date</label><input id="x8" type="datetime-local"></div></div>`;else if(table==='project_updates')html=`<div class="formgrid"><div><label>Update Type</label><select id="x1"><option>BOQ Revision</option><option>Price Change</option><option>Scope Change</option><option>Clarification</option><option>Technical Change</option><option>Other</option></select></div><div><label>Title</label><input id="x2"></div><div class="full"><label>Details</label><textarea id="x3"></textarea></div></div>`;else return;openModal('Add '+title,html+`<br><button onclick="saveChild('${table}')">Save</button>`)}
async function saveChild(table){let p=state.project,q={project_id:p.id};if(table==='technical_requests')Object.assign(q,{subject:$('x1').value,priority:$('x2').value,assigned_to:$('x3').value||null,status:$('x4').value,scope_notes:$('x5').value,requested_by:user.id});if(table==='quotations'){let {data:v}=await db.from('quotations').select('version_no').eq('project_id',p.id).order('version_no',{ascending:false}).limit(1);Object.assign(q,{quotation_number:$('x1').value,quotation_type:$('x2').value,value:Number($('x3').value||0),status:$('x4').value,sent_at:$('x5').value||null,notes:$('x6').value,prepared_by:user.id,version_no:(v?.[0]?.version_no||0)+1})}if(table==='follow_ups')Object.assign(q,{follow_up_date:$('x1').value||new Date().toISOString(),follow_up_type:$('x2').value,result:$('x3').value,next_action:$('x4').value,next_action_date:$('x5').value||null,company_id:p.company_id,responsible_id:user.id});if(table==='meetings')Object.assign(q,{meeting_date:$('x1').value||new Date().toISOString(),title:$('x2').value,meeting_type:$('x3').value,location:$('x4').value,attendees:$('x5').value,outcome:$('x6').value,next_action:$('x7').value,next_action_date:$('x8').value||null,company_id:p.company_id,responsible_id:user.id});if(table==='project_updates')Object.assign(q,{update_type:$('x1').value,title:$('x2').value,details:$('x3').value,created_by:user.id});let r=await db.from(table).insert(q);if(r.error)return alert(r.error.message);closeModal();openProject(p.id)}
async function collectionsTab(){let {data,error}=await db.from('collections').select('*').eq('project_id',state.project.id).order('collection_date',{ascending:false});if(error)return $('projectBody').innerHTML=esc(error.message);let total=(data||[]).reduce((s,x)=>s+Number(x.amount||0),0);let rem=Number(state.project.contract_value||0)-total;$('projectBody').innerHTML=`<div class="sectionTitle"><h3>Collections</h3><button onclick="addCollection()">+ Collection</button></div><div class="grid2"><div class="card"><small>Total Collected</small><h2>${money(total)} EGP</h2></div><div class="card"><small>Remaining</small><h2>${money(rem)} EGP</h2></div></div><div class="tablewrap"><table><tr><th>Date</th><th>Amount</th><th>Reference</th><th>Notes</th></tr>${(data||[]).map(x=>`<tr><td>${d(x.collection_date)}</td><td class="money">${money(x.amount)}</td><td>${esc(x.payment_reference)}</td><td>${esc(x.notes)}</td></tr>`).join('')}</table></div>`}function addCollection(){openModal('Add Collection',`<label>Date</label><input id="cx1" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Amount *</label><input id="cx2" type="number"><label>Payment Reference</label><input id="cx3"><label>Notes</label><textarea id="cx4"></textarea><br><button onclick="saveCollection()">Save</button>`)}async function saveCollection(){let amount=Number($('cx2').value||0);if(amount<=0)return alert('Amount must be greater than 0');let r=await db.from('collections').insert({project_id:state.project.id,collection_date:$('cx1').value,amount,payment_reference:$('cx3').value,notes:$('cx4').value,recorded_by:user.id});if(r.error)return alert(r.error.message);closeModal();openProject(state.project.id)}
async function docsTab(){let {data,error}=await db.from('project_documents').select('*').eq('project_id',state.project.id).order('created_at',{ascending:false});$('projectBody').innerHTML=`<div class="sectionTitle"><h3>Documents</h3><button onclick="uploadDoc()">+ Upload</button></div><div class="tablewrap"><table><tr><th>File</th><th>Type</th><th>Version</th><th>Uploaded</th><th></th></tr>${(data||[]).map(x=>`<tr><td>${esc(x.file_name)}</td><td>${esc(x.document_type)}</td><td>${x.version_no||1}</td><td>${dt(x.created_at)}</td><td><button class="secondary" onclick="openFile('${esc(x.storage_path)}')">Open</button></td></tr>`).join('')}</table></div>`;if(error)$('projectBody').innerHTML+=`<div class="error">${esc(error.message)}</div>`}
function uploadDoc(){openModal('Upload Document',`<label>Document Type</label><select id="dx1"><option>BOQ</option><option>RFQ</option><option>Technical Study</option><option>Quotation</option><option>Contract</option><option>Collection Receipt</option><option>Other</option></select><label>File</label><input id="dx2" type="file"><label>Notes</label><textarea id="dx3"></textarea><br><button onclick="saveDoc()">Upload</button>`)}async function saveDoc(){let f=$('dx2').files[0];if(!f)return alert('Choose a file');if(f.size>50*1024*1024)return alert('Maximum 50 MB');let path=`${state.project.id}/${Date.now()}_${f.name.replace(/[^a-zA-Z0-9._ -]/g,'_')}`;let r=await db.storage.from('crm-documents').upload(path,f,{contentType:f.type,upsert:false});if(r.error)return alert(r.error.message);let {data:v}=await db.from('project_documents').select('version_no').eq('project_id',state.project.id).eq('document_type',$('dx1').value).order('version_no',{ascending:false}).limit(1);let q=await db.from('project_documents').insert({project_id:state.project.id,uploaded_by:user.id,document_type:$('dx1').value,file_name:f.name,storage_path:path,version_no:(v?.[0]?.version_no||0)+1,notes:$('dx3').value});if(q.error){await db.storage.from('crm-documents').remove([path]);return alert(q.error.message)}closeModal();openProject(state.project.id)}async function openFile(path){let r=await db.storage.from('crm-documents').createSignedUrl(path,600);if(r.error)return alert(r.error.message);window.open(r.data.signedUrl,'_blank')}
async function followupsPage(){let {data,error}=await db.from('follow_ups').select('*,projects(name,project_code),companies(name),responsible:profiles!follow_ups_responsible_id_fkey(full_name)').order('next_action_date',{ascending:true});if(error)return pageError(error);$('page').innerHTML=`<div class="toolbar"><h2>Follow-ups</h2><select id="ff"><option value="all">All</option><option value="today">Today</option><option value="overdue">Overdue</option></select></div><div class="card"><div class="tablewrap"><table><tr><th>Project</th><th>Date</th><th>Type</th><th>Result</th><th>Next Action</th><th>Next Date</th><th>Responsible</th></tr>${(data||[]).map(x=>`<tr class="furow" data-date="${x.next_action_date||''}"><td>${esc(x.projects?.name)}</td><td>${dt(x.follow_up_date)}</td><td>${esc(x.follow_up_type)}</td><td>${esc(x.result)}</td><td>${esc(x.next_action)}</td><td>${dt(x.next_action_date)}</td><td>${esc(x.responsible?.full_name)}</td></tr>`).join('')}</table></div></div>`;$('ff').onchange=()=>{let v=$('ff').value,now=new Date();document.querySelectorAll('.furow').forEach(r=>{let z=r.dataset.date?new Date(r.dataset.date):null;let show=v==='all'||(v==='today'&&z&&z.toDateString()===now.toDateString())||(v==='overdue'&&z&&z<now);r.style.display=show?'':'none'})}}
async function meetingsPage(){let {data,error}=await db.from('meetings').select('*,projects(name),companies(name),responsible:profiles!meetings_responsible_id_fkey(full_name)').order('meeting_date',{ascending:false});if(error)return pageError(error);$('page').innerHTML=`<div class="toolbar"><h2>Meetings</h2></div><div class="card"><div class="tablewrap"><table><tr><th>Date</th><th>Title</th><th>Company</th><th>Project</th><th>Type</th><th>Outcome</th><th>Responsible</th></tr>${(data||[]).map(x=>`<tr><td>${dt(x.meeting_date)}</td><td>${esc(x.title)}</td><td>${esc(x.companies?.name)}</td><td>${esc(x.projects?.name)}</td><td>${esc(x.meeting_type)}</td><td>${esc(x.outcome)}</td><td>${esc(x.responsible?.full_name)}</td></tr>`).join('')}</table></div></div>`}
function pageError(e){$('page').innerHTML=`<div class="error">${esc(e?.message||e)}</div>`}function openModal(t,b){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}
window.addEventListener('load',async()=>{let {data:{session}}=await db.auth.getSession();if(session)boot(session.user)});
</script></body></html>
