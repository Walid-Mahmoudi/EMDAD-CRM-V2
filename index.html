<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EMDAD CRM</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--red:#c83535;--ink:#17202a;--muted:#6b7280;--bg:#f5f6f8;--card:#fff;--line:#e5e7eb;--green:#15803d;--orange:#c2410c}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
    button,input,select,textarea{font:inherit} button{cursor:pointer}.hidden{display:none!important}
    .login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#fff,#f3f4f6)}
    .login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:0 20px 60px #00000012}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.logo{width:48px;height:48px;border-radius:14px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}.brand h1{margin:0;font-size:22px}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}
    label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px} input,select,textarea{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:11px 12px;background:#fff} textarea{min-height:90px;resize:vertical}
    .btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700}.primary{background:var(--red);color:#fff}.secondary{background:#eef0f3;color:var(--ink)}
    .shell{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:#15191f;color:#fff;padding:20px;position:sticky;top:0;height:100vh}.side .brand{margin-bottom:30px}.side .logo{background:#fff;color:var(--red)}
    .nav button{width:100%;text-align:left;background:transparent;color:#cbd5e1;border:0;padding:12px;border-radius:9px;margin:3px 0}.nav button.active,.nav button:hover{background:#252b34;color:#fff}.side-bottom{position:absolute;bottom:20px;left:20px;right:20px}.side-bottom button{width:100%}
    main{padding:28px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.top h2{margin:0}.user{color:var(--muted);font-size:13px;text-align:right}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px}.metric{font-size:26px;font-weight:800;margin-top:6px}.label{font-size:12px;color:var(--muted)}
    .toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:20px 0 12px}.toolbar .actions{display:flex;gap:8px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:15px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-size:12px;background:#fafafa}tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2ff;font-size:11px;font-weight:700}.badge.green{background:#dcfce7;color:var(--green)}.badge.orange{background:#ffedd5;color:var(--orange)}.badge.red{background:#fee2e2;color:#b91c1c}
    .modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:10}.modal-card{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.x{border:0;background:#f1f1f1;border-radius:50%;width:34px;height:34px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}.full{grid-column:1/-1}.empty{padding:35px;text-align:center;color:var(--muted)}.error{color:#b91c1c;background:#fee2e2;padding:10px;border-radius:10px;font-size:13px;margin-top:12px}.success{color:#166534;background:#dcfce7;padding:10px;border-radius:10px;font-size:13px;margin-top:12px}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;height:auto}.nav{display:flex;overflow:auto}.nav button{min-width:110px}.side-bottom{position:static;margin-top:12px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){main{padding:16px}.grid,.form-grid{grid-template-columns:1fr}.top{align-items:flex-start}.user{display:none}}
  </style>
</head>
<body>
  <section id="login" class="login">
    <div class="login-card">
      <div class="brand"><div class="logo">E</div><div><h1>EMDAD CRM</h1><p>Engineering Solutions • Sales Management</p></div></div>
      <div id="loginMsg"></div>
      <label>Email</label><input id="email" type="email" autocomplete="email" placeholder="name@emdad.com" />
      <label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      <div style="display:flex;gap:8px;margin-top:18px"><button class="btn primary" style="flex:1" onclick="signIn()">Sign in</button><button class="btn secondary" onclick="signUp()">Create account</button></div>
    </div>
  </section>

  <section id="app" class="shell hidden">
    <aside class="side">
      <div class="brand"><div class="logo">E</div><div><h1 style="font-size:17px">EMDAD CRM</h1><p style="color:#94a3b8">Pipeline & Collections</p></div></div>
      <nav class="nav">
        <button data-page="dashboard" class="active" onclick="showPage('dashboard')">Dashboard</button>
        <button data-page="projects" onclick="showPage('projects')">Projects</button>
        <button data-page="companies" onclick="showPage('companies')">Companies</button>
        <button data-page="followups" onclick="showPage('followups')">Follow-ups</button>
        <button data-page="collections" onclick="showPage('collections')">Collections</button>
      </nav>
      <div class="side-bottom"><button class="btn secondary" onclick="signOut()">Sign out</button></div>
    </aside>
    <main>
      <div class="top"><div><h2 id="pageTitle">Dashboard</h2><div class="label" id="pageSub">Live CRM overview</div></div><div class="user"><b id="userName">User</b><br><span id="userRole">sales</span></div></div>
      <div id="content"></div>
    </main>
  </section>

  <div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle">New</h3><button class="x" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>

<script>
const SUPABASE_URL='https://quprtdxhjfmiodbjvrsq.supabase.co';
const SUPABASE_KEY='sb_publishable_f3GJikH0CSBrX_jNIvJI6A_-oCJByhX';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentProfile=null;
const labels={tender_in_market:'Tender in Market',in_hand:'In Hand',official_tender:'Official Tender',new:'New',rfq_received:'RFQ Received',sent_to_technical:'Sent to Technical',technical_pricing:'Technical Pricing',pricing_completed:'Pricing Completed',quotation_sent:'Quotation Sent',follow_up:'Follow-up',negotiation:'Negotiation',won:'Won',lost:'Lost',cancelled:'Cancelled'};
const money=n=>new Intl.NumberFormat('en-EG',{maximumFractionDigits:0}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(text,type='error'){document.getElementById('loginMsg').innerHTML=`<div class="${type}">${esc(text)}</div>`}
async function signIn(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await sb.auth.signInWithPassword({email,password});if(error)msg(error.message)}
async function signUp(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<6)return msg('Enter an email and a password of at least 6 characters.');const {error}=await sb.auth.signUp({email,password});if(error)msg(error.message);else msg('Account created. If email confirmation is enabled, confirm your email then sign in.','success')}
async function signOut(){await sb.auth.signOut()}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(session)await enter(session.user);sb.auth.onAuthStateChange(async(_e,s)=>{if(s)await enter(s.user);else{currentUser=null;currentProfile=null;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}})}
async function enter(user){currentUser=user;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');const {data,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();currentProfile=data||{full_name:user.email,role:'sales'};document.getElementById('userName').textContent=currentProfile.full_name||user.email;document.getElementById('userRole').textContent=currentProfile.role||'sales';showPage('dashboard')}
function showPage(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const titles={dashboard:['Dashboard','Live CRM overview'],projects:['Projects','Pipeline, quotations and project lifecycle'],companies:['Companies','Customers and contacts'],followups:['Follow-ups','Today and overdue activities'],collections:['Collections','Contracted value, collected and remaining']};document.getElementById('pageTitle').textContent=titles[page][0];document.getElementById('pageSub').textContent=titles[page][1];({dashboard:renderDashboard,projects:renderProjects,companies:renderCompanies,followups:renderFollowups,collections:renderCollections}[page])()}
async function renderDashboard(){document.getElementById('content').innerHTML='<div class="empty">Loading dashboard…</div>';const [{data:p},{data:f},{data:c}] = await Promise.all([sb.from('projects').select('project_type,status,estimated_value,contract_value'),sb.from('follow_ups').select('follow_up_date,next_action_date,result,project_id').order('follow_up_date',{ascending:false}).limit(8),sb.from('collections').select('amount')]);const rows=p||[];const open=rows.filter(x=>!['won','lost','cancelled'].includes(x.status));const est=open.reduce((a,x)=>a+Number(x.estimated_value||0),0),inh=open.filter(x=>x.project_type==='in_hand').reduce((a,x)=>a+Number(x.estimated_value||0),0),won=rows.filter(x=>x.status==='won').reduce((a,x)=>a+Number(x.contract_value||0),0),col=(c||[]).reduce((a,x)=>a+Number(x.amount||0),0);document.getElementById('content').innerHTML=`<div class="grid"><div class="card"><div class="label">Open Estimated Pipeline</div><div class="metric">${money(est)} EGP</div></div><div class="card"><div class="label">In Hand Pipeline</div><div class="metric">${money(inh)} EGP</div></div><div class="card"><div class="label">Won / Contracted</div><div class="metric">${money(won)} EGP</div></div><div class="card"><div class="label">Total Collected</div><div class="metric">${money(col)} EGP</div></div></div><div class="toolbar"><h3>Pipeline by type</h3><button class="btn primary" onclick="openProjectModal()">+ New Project</button></div><div class="grid"><div class="card"><div class="label">Tender in Market</div><div class="metric">${money(open.filter(x=>x.project_type==='tender_in_market').reduce((a,x)=>a+Number(x.estimated_value||0),0))}</div></div><div class="card"><div class="label">Official Tender</div><div class="metric">${money(open.filter(x=>x.project_type==='official_tender').reduce((a,x)=>a+Number(x.estimated_value||0),0))}</div></div><div class="card"><div class="label">Open Projects</div><div class="metric">${open.length}</div></div><div class="card"><div class="label">Overdue Follow-ups</div><div class="metric">${(f||[]).filter(x=>x.next_action_date&&new Date(x.next_action_date)<new Date()).length}</div></div></div>`}
async function renderProjects(){document.getElementById('content').innerHTML='<div class="empty">Loading projects…</div>';const {data,error}=await sb.from('projects').select('id,project_code,name,project_type,status,estimated_value,contract_value,win_probability,currency,created_at,companies(name)').order('created_at',{ascending:false});if(error)return document.getElementById('content').innerHTML=`<div class="error">${esc(error.message)}</div>`;const rows=data||[];document.getElementById('content').innerHTML=`<div class="toolbar"><div class="actions"><input id="projectSearch" placeholder="Search project…" oninput="filterTable('projectTable',this.value)" style="max-width:280px"></div><button class="btn primary" onclick="openProjectModal()">+ New Project</button></div><div class="table-wrap"><table id="projectTable"><thead><tr><th>Code</th><th>Project</th><th>Company</th><th>Type</th><th>Status</th><th>Estimated</th><th>Contract</th><th>Win %</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.project_code)}</td><td>${esc(x.name)}</td><td>${esc(x.companies?.name)}</td><td>${labels[x.project_type]||x.project_type}</td><td><span class="badge ${x.status==='won'?'green':x.status==='lost'?'red':'orange'}">${labels[x.status]||x.status}</span></td><td>${x.estimated_value==null?'—':money(x.estimated_value)+' '+x.currency}</td><td>${x.contract_value==null?'—':money(x.contract_value)+' '+x.currency}</td><td>${x.win_probability}%</td></tr>`).join('')}</tbody></table></div>`}
async function renderCompanies(){document.getElementById('content').innerHTML='<div class="empty">Loading companies…</div>';const {data,error}=await sb.from('companies').select('id,name,customer_type,industry,city,phone,email,created_at').order('name');if(error)return document.getElementById('content').innerHTML=`<div class="error">${esc(error.message)}</div>`;document.getElementById('content').innerHTML=`<div class="toolbar"><input placeholder="Search company…" oninput="filterTable('companyTable',this.value)" style="max-width:280px"><button class="btn primary" onclick="openCompanyModal()">+ New Company</button></div><div class="table-wrap"><table id="companyTable"><thead><tr><th>Company</th><th>Customer</th><th>Industry</th><th>City</th><th>Phone</th><th>Email</th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.customer_type==='existing'?'Existing':'New'}</td><td>${esc(x.industry)}</td><td>${esc(x.city)}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td></tr>`).join('')}</tbody></table></div>`}
async function renderFollowups(){document.getElementById('content').innerHTML='<div class="empty">Loading follow-ups…</div>';const {data,error}=await sb.from('follow_ups').select('id,follow_up_date,follow_up_type,result,next_action,next_action_date,projects(name),companies(name)').order('next_action_date',{ascending:true,nullsFirst:false});if(error)return document.getElementById('content').innerHTML=`<div class="error">${esc(error.message)}</div>`;const now=new Date(),rows=data||[];document.getElementById('content').innerHTML=`<div class="grid"><div class="card"><div class="label">Today</div><div class="metric">${rows.filter(x=>x.next_action_date&&new Date(x.next_action_date).toDateString()===now.toDateString()).length}</div></div><div class="card"><div class="label">Overdue</div><div class="metric">${rows.filter(x=>x.next_action_date&&new Date(x.next_action_date)<now).length}</div></div></div><div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Next Action</th><th>Date</th><th>Type</th><th>Project</th><th>Company</th><th>Result</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.next_action)}</td><td>${x.next_action_date?new Date(x.next_action_date).toLocaleString():'—'}</td><td>${esc(x.follow_up_type)}</td><td>${esc(x.projects?.name)}</td><td>${esc(x.companies?.name)}</td><td>${esc(x.result)}</td></tr>`).join('')}</tbody></table></div>`}
async function renderCollections(){document.getElementById('content').innerHTML='<div class="empty">Loading collections…</div>';const {data,error}=await sb.from('project_financials').select('*');if(error)return document.getElementById('content').innerHTML=`<div class="error">${esc(error.message)}</div>`;const rows=data||[],contract=rows.reduce((a,x)=>a+Number(x.contract_value||0),0),col=rows.reduce((a,x)=>a+Number(x.total_collected||0),0),rem=rows.reduce((a,x)=>a+Number(x.remaining||0),0);document.getElementById('content').innerHTML=`<div class="grid"><div class="card"><div class="label">Contracted</div><div class="metric">${money(contract)} EGP</div></div><div class="card"><div class="label">Collected</div><div class="metric">${money(col)} EGP</div></div><div class="card"><div class="label">Remaining</div><div class="metric">${money(rem)} EGP</div></div><div class="card"><div class="label">Projects with Contract</div><div class="metric">${rows.length}</div></div></div><div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Project</th><th>Contract Value</th><th>Collected</th><th>Remaining</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.project_name||x.name||x.project_id)}</td><td>${money(x.contract_value)}</td><td>${money(x.total_collected)}</td><td>${money(x.remaining)}</td></tr>`).join('')}</tbody></table></div>`}
function filterTable(id,q){q=q.toLowerCase();document.querySelectorAll('#'+id+' tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function openProjectModal(){document.getElementById('modalTitle').textContent='New Project';document.getElementById('modalBody').innerHTML=`<div class="form-grid"><div class="full"><label>Project Name *</label><input id="p_name" placeholder="Project name"></div><div><label>Project Type *</label><select id="p_type"><option value="in_hand">In Hand</option><option value="tender_in_market">Tender in Market</option><option value="official_tender">Official Tender</option></select></div><div><label>Win Probability %</label><input id="p_prob" type="number" min="0" max="100" value="0"></div><div class="full"><label>Company ID *</label><input id="p_company" placeholder="Paste company UUID for now"></div><div><label>Expected Start</label><input id="p_start" type="date"></div><div><label>Currency</label><input id="p_currency" value="EGP"></div><div class="full"><label>Notes</label><textarea id="p_notes"></textarea></div></div><div class="label" style="margin-top:12px">Estimated Value is intentionally not entered at project creation; it is added after technical pricing.</div><button class="btn primary" style="margin-top:16px" onclick="createProject()">Create Project</button>`;document.getElementById('modal').classList.remove('hidden')}
function openCompanyModal(){document.getElementById('modalTitle').textContent='New Company';document.getElementById('modalBody').innerHTML=`<div class="form-grid"><div class="full"><label>Company Name *</label><input id="c_name"></div><div><label>Customer Type</label><select id="c_type"><option value="new">New Customer</option><option value="existing">Existing Customer</option></select></div><div><label>Industry</label><input id="c_industry"></div><div><label>City</label><input id="c_city"></div><div><label>Phone</label><input id="c_phone"></div><div><label>Email</label><input id="c_email" type="email"></div><div class="full"><label>Address</label><input id="c_address"></div><div class="full"><label>Notes</label><textarea id="c_notes"></textarea></div></div><button class="btn primary" style="margin-top:16px" onclick="createCompany()">Create Company</button>`;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
async function createCompany(){const name=document.getElementById('c_name').value.trim();if(!name)return alert('Company name is required.');const {error}=await sb.from('companies').insert({name,customer_type:document.getElementById('c_type').value,industry:document.getElementById('c_industry').value||null,city:document.getElementById('c_city').value||null,phone:document.getElementById('c_phone').value||null,email:document.getElementById('c_email').value||null,address:document.getElementById('c_address').value||null,notes:document.getElementById('c_notes').value||null,created_by:currentUser.id});if(error)return alert(error.message);closeModal();renderCompanies()}
async function createProject(){const name=document.getElementById('p_name').value.trim(),company_id=document.getElementById('p_company').value.trim();if(!name||!company_id)return alert('Project name and Company UUID are required.');const payload={name,company_id,project_type:document.getElementById('p_type').value,win_probability:Number(document.getElementById('p_prob').value||0),currency:document.getElementById('p_currency').value||'EGP',expected_start:document.getElementById('p_start').value||null,notes:document.getElementById('p_notes').value||null,created_by:currentUser.id,sales_owner_id:currentUser.id};const {error}=await sb.from('projects').insert(payload);if(error)return alert(error.message);closeModal();renderProjects()}
boot();
</script>
</body></html>
