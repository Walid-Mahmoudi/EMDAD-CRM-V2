async function renderProjects(){document.getElementById('content').innerHTML='<div class="empty">Loading…</div>';const {data,error}=await sb.from('projects').select('id,project_code,name,project_type,status,estimated_value,contract_value,win_probability,currency,created_at,companies(name)').order('created_at',{ascending:false});if(error)return document.getElementById('content').innerHTML=`<div class="error">${esc(error.message)}</div>`;const rows=data||[];document.getElementById('content').innerHTML=`<div class="toolbar"><input id="projectSearch" placeholder="Search project / company…" oninput="filterTable('projectTable',this.value)" style="max-width:320px"><button class="btn primary" onclick="openProjectModal()">+ New Project</button></div><div class="table-wrap"><table id="projectTable"><thead><tr><th>Code</th><th>Project</th><th>Company</th><th>Type</th><th>Status</th><th>Estimated</th><th>Contract</th><th>Win %</th></tr></thead><tbody>${rows.map(x=>`<tr class="click" onclick="openProject('${x.id}')"><td>${esc(x.project_code)}</td><td><b>${esc(x.name)}</b><div class="small">${new Date(x.created_at).toLocaleDateString('en-GB')}</div></td><td>${esc(x.companies?.name)}</td><td>${esc(labels[x.project_type]||x.project_type)}</td><td>${badge(x.status)}</td><td>${x.estimated_value==null?'—':money(x.estimated_value)+' '+esc(x.currency)}</td><td>${x.contract_value==null?'—':money(x.contract_value)+' '+esc(x.currency)}</td><td>${x.win_probability??0}%</td></tr>`).join('')}</tbody></table></div>`}

abel">Contract Value</div><b>${p.contract_value==null?'—':money(p.contract_value)+' '+esc(p.currency)}</b></div><div class="card"><div class="label">Win Probability</div><b>${p.win_probability??0}%</b></div></div>${p.status==='won'?`<div class="card" style="margin-top:10px"><b>Collections:</b> ${money(collected)} collected • ${money(Math.max(0,remaining))} remaining</div>`:''}<div class="tabs"><button class="active" onclick="projectTab(this,'overview')">Overview</button><button onclick="projectTab(this,'technical')">Technical Requests (${tech.length})</button><button onclick="projectTab(this,'quotes')">Quotations (${quotes.length})</button><button onclick="projectTab(this,'follow')">Follow-ups (${follows.length})</button><button onclick="projectTab(this,'meetings')">Meetings (${meetings.length})</button><button onclick="projectTab(this,'updates')">Updates (${updates.length})</button><button onclick="projectTab(this,'docs')">Documents (${documents.length})</button><button onclick="projectTab(this,'collections')">Collections (${collections.length})</button></div><div id="projectTab"></div>`;projectData={p,tech,quotes,follows,meetings,updates,documents,collections};renderProjectTab('overview')}
let projectData={};function projectTab(btn,t){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');renderProjectTab(t)}
function renderProjectTab(t){const d=projectData,p=d.p;if(t==='overview'){document.getElementById('projectTab').innerHTML=`<div class="grid"><div class="card"><b>Company</b><p>${esc(p.companies?.name)}</p></div><div class="card"><b>Contact</b><p>${esc(p.contacts?.name||'—')}</p></div><div class="card"><b>Expected Start</b><p>${esc(p.expected_start||'—')}</p></div><div class="card"><b>Lost Reason</b><p>${esc(p.lost_reason||'—')}</p></div></div><div class="card" style="margin-top:15px"><b>Notes</b><p>${esc(p.notes||'—')}</p></div><div class="section"><div class="section-head"><h4>Activity History</h4><button class="btn secondary" onclick="quickUpdate()">+ Add Update</button></div><div class="timeline">${[...d.updates.map(x=>({date:x.created_at,title:x.title,details:x.details,type:x.update_type})),...d.follows.map(x=>({date:x.follow_up_date,title:labels[x.follow_up_type]||x.follow_up_type,details:x.result||x.notes,type:'Follow-up'})),...d.meetings.map(x=>({date:x.meeting_date,title:x.title,details:x.outcome,type:'Meeting'}))].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,15).map(x=>`<div class="event"><b>${esc(x.title||x.type)}</b><div class="small">${esc(x.date||'')}</div><div>${esc(x.details||'')}</div></div>`).join('')||'<div class="empty">No activity yet.</div>'}</div></div>`}else if(t==='technical'){document.getElementById('projectTab').innerHTML=sectionTable('Technical Requests','Add Technical Request',['Requested','Subject','Status','Pricing','Completed'],d.tech.map(x=>[x.requested_at,x.subject,labels[x.status]||x.status,x.pricing_value==null?'—':money(x.pricing_value),x.completed_at||'—']),`openTechnicalModal()`)}else if(t==='quotes'){document.getElementById('projectTab').innerHTML=sectionTable('Quotations','Add Quotation',['Version','Number','Date','Value','Status','Sent'],d.quotes.map(x=>[x.version_no,x.quotation_number||'—',x.quotation_date,x.value==null?'—':money(x.value)+' '+x.currency,x.status,x.sent_at||'—']),`openQuotationModal()`)}else if(t==='follow'){document.getElementById('projectTab').innerHTML=sectionTable('Follow-ups','Add Follow-up',['Date','Type','Result','Next Action','Next Date'],d.follows.map(x=>[x.follow_up_date,labels[x.follow_up_type]||x.follow_up_type,x.result||'—',x.next_action||'—',x.next_action_date||'—']),`openFollowModal()`)}else if(t==='meetings'){document.getElementById('projectTab').innerHTML=sectionTable('Project Meetings','Add Meeting',['Date','Title','Type','Outcome','Next Date'],d.meetings.map(x=>[x.meeting_date,x.title,x.meeting_type,x.outcome||'—',x.next_action_date||'—']),`openMeetingModal()`)}else if(t==='updates'){document.getElementById('projectTab').innerHTML=sectionTable('Project Updates','Add Update',['Date','Type','Title','Details'],d.updates.map(x=>[new Date(x.created_at).toLocaleString('en-GB'),x.update_type,x.title,x.details]),`quickUpdate()`)}else if(t==='docs'){document.getElementById('projectTab').innerHTML=sectionTable('Documents','Add Document',['Date','Type','File','Version'],d.documents.map(x=>[new Date(x.created_at).toLocaleDateString('en-GB'),x.document_type,x.file_name,x.version_no]),`openDocumentModal()`)}else if(t==='collections'){document.getElementById('projectTab').innerHTML=sectionTable('Collections','Add Collection',['Date','Amount','Reference','Notes'],d.collections.map(x=>[x.collection_date,money(x.amount)+' '+p.currency,x.payment_reference||'—',x.notes||'—']),`openCollectionModal()`)}}
function sectionTable(title,action,heads,rows,fn){return `<div class="section"><div class="section-head"><h4>${title}</h4><button class="btn primary" onclick="${fn}">+ ${action}</button></div><div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${heads.length}" class="empty">No records yet.</td></tr>`}</tbody></table></div></div>`}
function quickUpdate(){openModal('Add Project Update',`<label>Update Type</label><select id="up_type"><option>BOQ Change</option><option>Price Change</option><option>Scope Change</option><option>Clarification</option><option>Technical Change</option><option>General</option></select><label>Title</label><input id="up_title"><label>Details</label><textarea id="up_details"></textarea><div class="toolbar"><span></span><button class="btn primary" onclick="saveUpdate()">Save Update</button></div>`)}
async function saveUpdate(){const {error}=await sb.from('project_updates').insert({project_id:currentProject.id,created_by:currentUser.id,update_type:val('up_type'),title:val('up_title'),details:val('up_details')});if(error)return alert(error.message);closeModal();openProject(currentProject.id)}
function openTechnicalModal(){openModal('Send to Technical Support',`<div class="form-grid"><div><label>Subject *</label><input id="tr_subject"></div><div><label>Status</label><select id="tr_status"><option value="requested">Requested</option><option value="in_progress">In Progress</option><option value="completed">Completed</option></select></div><div class="full"><label>Scope / BOQ Notes</label><textarea id="tr_scope"></textarea></div><div><label>Pricing Value</label><input id="tr_value" type="number" min="0"></div><div class="full"><label>Technical Notes</label><textarea id="tr_notes"></textarea></div></div><div class="toolbar"><span></span><button class="btn primary" onclick="saveTechnical()">Send Request</button></div>`)}
async function saveTechnical(){const {error}=await sb.from('technical_requests').insert({project_id:currentProject.id,requested_by:currentUser.id,subject:val('tr_subject'),status:val('tr_status'),scope_notes:val('tr_scope')||null,pricing_value:val('tr_value')?Number(val('tr_value')):null,technical_notes:val('tr_notes')||null,completed_at:val('tr_status')==='completed'?new Date().toISOString():null});if(error)return alert(error.message);if(val('tr_value'))await sb.from('projects').update({estimated_value:Number(val('tr_value')),status:'pricing_completed'}).eq('id',currentProject.id);closeModal();openProject(currentProject.id)}
function openQuotationModal(){const next=(projectData.quotes.reduce((m,x)=>Math.max(m,Number(x.version_no||0)),0)+1);openModal('Add Quotation',`<div class="form-grid"><div><label>Version</label><input id="q_ver" type="number" value="${next}"></div><div><label>Quotation Number</label><input id="q_no"></div><div><label>Quotation Date</label><input id="q_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Value *</label><input id="q_value" type="number" min="0"></div><div><label>Currency</label><select id="q_cur"><option>EGP</option><option>USD</option></select></div><div><label>Status</label><select id="q_status"><option>Draft</option><option>Sent</option><option>Revised</option><option>Accepted</option><option>Rejected</option></select></div><div><label>Sent At</label><input id="q_sent" type="datetime-local"></div><div class="full"><label>Notes</label><textarea id="q_notes"></textarea></div></div><div class="toolbar"><span></span><button class="btn primary" onclick="saveQuotation()">Save Quotation</button></div>`)}
async function saveQuotation(){const {error}=await sb.from('quotations').insert({project_id:currentProject.id,version_no:Number(val('q_ver')),quotation_number:val('q_no')||null,quotation_date:iso('q_date'),value:Number(val('q_value')||0),currency:val('q_cur'),status:val('q_status'),prepared_by:currentUser.id,sent_at:iso('q_sent'),notes:val('q_notes')||null});if(error)return alert(error.message);closeModal();openProject(currentProject.id)}
function openFollowModal(){openModal('Add Follow-up',`<div class="form-grid"><div><label>Date</label><input id="f_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Type</label><select id="f_type"><option value="phone">Phone Call</option><option value="whatsapp">WhatsApp</option><option value="email">Email</option><option value="meeting">Meeting</option><option value="site_visit">Site Visit</option><option value="online_meeting">Online Meeting</option><option value="other">Other</option></select></div><div class="full"><label>Result / Outcome</label><textarea id="f_result"></textarea></div><div><label>Next Action</label><input id="f_next"></div><div><label>Next Action Date</label><input id="f_nextdate" type="date"></div><div class="full"><label>Notes</label><textarea id="f_notes"></textarea></div></div><div class="toolbar"><span></span><button class="btn primary" onclick="saveFollow()">Save Follow-up</button></div>`)}
async function saveFollow(){const {error}=await sb.from('follow_ups').insert({project_id:currentProject.id,company_id:currentProject.company_id,responsible_id:currentUser.id,follow_up_date:iso('f_date'),follow_up_type:val('f_type'),result:val('f_result')||null,next_action:val('f_next')||null,next_action_date:iso('f_nextdate'),notes:val('f_notes')||null});if(error)return alert(error.message);closeModal();openProject(currentProject.id)}
function openMeetingModal(){openModal('Add Project Meeting',`<div class="form-grid"><div><label>Date</label><input id="m_date" type="datetime-local"></div><div><label>Title</label><input id="m_title"></div><div><label>Meeting Type</label><select id="m_type"><option>Project Meeting</option><option>Site Meeting</option><option>Online Meeting</option><option>Client Meeting</option></select></div><div><label>Location</label><input id="m_loc"></div><div class="full"><label>Attendees</label><input id="m_att"></div><div class="full"><label>Outcome</label><textarea id="m_out"></textarea></div><div><label>Next Action</label><input id="m_next"></div><div><label>Next Action Date</label><input id="m_nextdate" type="date"></div></div><div class="toolbar"><span></span><button class="btn primary" onclick="saveMeeting()">Save Meeting</button></div>`)}
async function saveMeeting(){const {error}=await sb.from('meetings').insert({company_id:currentProject.company_id,project_id:currentProject.id,meeting_date:iso('m_date'),title:val('m_title'),meeting_type:val('m_type'),location:val('m_loc')||null,attendees:val('m_att')||null,outcome:val('m_out')||null,next_action:val('m_next')||null,next_action_date:iso('m_nextdate'),responsible_id:currentUser.id});if(error)return alert(error.message);closeModal();openProject(currentProject.id)}
function openDocumentModal(){openModal('Add Document Record',`<div class="form-grid"><div><label>Document Type</label><select id="d_type"><option>BOQ / RFQ</option><option>Drawing</option><option>Specification</option><option>Technical Study</option><option>Pricing</option><option>Quotation</option><option>Revised Quotation</option><option>Technical Submittal</option><option>Contract</option><option>Other</option></select></div><div><label>File Name</label><input id="d_name" placeholder="e.g. Project_BOQ.pdf"></div><div><label>Storage Path</label><input id="d_path" placeholder="Storage path / URL"></div><div><label>Version</label><input id="d_ver" type="number" value="1"></div></div><div class="small" style="margin-top:10px">This records the document metadata. Supabase Storage upload can be connected next without changing the workflow.</div><div class="toolbar"><span></span><button class="btn primary" onclick="saveDocument()">Save Document</button></div>`)}
async function saveDocument(){const {error}=await sb.from('project_documents').insert({project_id:currentProject.id,uploaded_by:currentUser.id,document_type:val('d_type'),file_name:val('d_name'),storage_path:val('d_path')||null,version_no:Number(val('d_ver')||1)});if(error)return alert(error.message);closeModal();openProject(currentProject.id)}
function openCollectionModal(){if(currentProject.status!=='won')return alert('Collections are available after the project is Won.');openModal('Add Collection',`<div class="form-grid"><div><label>Collection Date</label><input id="c_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Amount *</label><input id="c_amount" type="number" min="0"></div><div><label>Payment Reference</label><input id="c_ref"></div><div class="full"><label>Notes</label><textarea id="c_notes"></textarea></div><div class="full"><label>Attachment Path</label><input id="c_path"></div></div><div class="toolbar"><span></span><button class="btn primary" onclick="saveCollection()">Save Collection</button></div>`)}
async function saveCollection(){const amount=Number(val('c_amount')||0);if(!amount)return alert('Amount is required.');const {error}=await sb.from('collections').insert({project_id:currentProject.id,collection_date:iso('c_date'),amount,payment_reference:val('c_ref')||null,notes:val('c_notes')||null,attachment_path:val('c_path')||null,recorded_by:currentUser.id});if(error)return alert(error.message);closeModal();openProject(currentProject.id)}
async function advanceProject(id){const {data:p,error}=await sb.from('projects').select('*').eq('id',id).single();if(error)return alert(error.message);openModal('Update Project Stage',`<div class="form-grid"><div><label>Status</label><select id="st_status">${['new','rfq_received','sent_to_technical','technical_pricing','pricing_completed','quotation_sent','follow_up','negotiation','won','lost','cancelled'].map(x=>`<option value="${x}" ${p.status===x?'selected':''}>${labels[x]}</option>`).join('')}</select></div><div><label>Win Probability %</label><input id="st_prob" type="number" min="0" max="100" value="${p.win_probability??0}"></div><div id="contractWrap" class="full"></div><div id="lostWrap" class="full"></div></div><div class="toolbar"><span></span><button class="btn primary" onclick="saveStage('${id}')">Save Stage</button></div>`);document.getElementById('st_status').onchange=()=>stageFields(p)}function stageFields(p){const s=val('st_status');document.getElementById('contractWrap').innerHTML=s==='won'?`<label>Contract Value *</label><input id="st_contract" type="number" min="0" value="${p.contract_value||p.estimated_value||''}"><label>Contract Date</label><input id="st_date" type="date" value="${p.contract_date||''}">`:'';document.getElementById('lostWrap').innerHTML=s==='lost'?`<label>Lost Reason</label><select id="st_lost"><option>Price</option><option>Competitor</option><option>Client Cancelled</option><option>Project Cancelled</option><option>Technical</option><option>No Response</option><option>Other</option></select>`:''}async function saveStage(id){const s=val('st_status'),patch={status:s,win_probability:Number(val('st_prob')||0)};if(s==='won'){const v=Number(val('st_contract')||0);if(!v)return alert('Contract Value is required when Won.');patch.contract_value=v;patch.contract_date=iso('st_date')}if(s==='lost')patch.lost_reason=val('st_lost');const {error}=await sb.from('projects').update(patch).eq('id',id);if(error)return alert(error.message);closeModal();openProject(id)}
async function editProject(id){const {data:p}=await sb.from('projects').select('*').eq('id',id).single();const co=await companyOptions();openModal('Edit Project',`<div class="form-grid"><div class="full"><label>Project Name</label><input id="ep_name" value="${esc(p.name)}"></div><div><label>Company</label><select id="ep_company">${co.replace(`value="${p.company_id}"`,`value="${p.company_id}" selected`)}</select></div><div><label>Project Type</label><select id="ep_type">${['in_hand','tender_in_market','official_tender'].map(x=>`<option value="${x}" ${p.project_type===x?'selected':''}>${labels[x]}</option>`).join('')}</select></div><div><label>Estimated Value</label><input id="ep_est" type="number" value="${p.estimated_value??''}"></div><div><label>Win Probability %</label><input id="ep_prob" type="number" value="${p.win_probability??0}"></div><div><label>Expected Start</label><input id="ep_start" type="date" value="${p.expected_start||''}"></div><div class="full"><label>Notes</label><textarea id="ep_notes">${esc(p.notes||'')}</textarea></div></div><div class="toolbar"><span></span><button class="btn primary" onclick="saveEdit('${id}')">Save Changes</button></div>`)}
async function saveEdit(id){const {error}=await sb.from('projects').update({name:val('ep_name'),company_id:val('ep_company'),project_type:val('ep_type'),estimated_value:val('ep_est')?Number(val('ep_est')):null,win_probability:Number(val('ep_prob')||0),expected_start:iso('ep_start'),notes:val('ep_notes')||null}).eq('id',id);if(error)return alert(error.message);closeModal();openProject(id)}
async function renderFollowups(){document.getElementById('content').innerHTML='<div class="empty">Loading…</div>';const {data,error}=await sb.from('follow_ups').select('*,projects(name,project_code),companies(name)').order('next_action_date',{ascending:true,nullsFirst:false});if(error)return document.getElementById('content').innerHTML=`<div class="error">${esc(error.message)}</div>`;const today=new Date();today.setHours(0,0,0,0);const rows=data||[];document.getElementById('content').innerHTML=`<div class="grid"><div class="card"><div class="label">Due Today</div><div class="metric">${rows.filter(x=>x.next_action_date&&new Date(x.next_action_date).toDateString()===today.toDateString()).length}</div></div><div class="card"><div class="label">Overdue</div><div class="metric">${rows.filter(x=>x.next_action_date&&new Date(x.next_action_date)<today).length}</div></div></div><div class="table-wrap" style="margin-top:15px"><table><thead><tr><th>Next Date</th><th>Project</th><th>Company</th><th>Type</th><th>Result</th><th>Next Action</th></tr></thead><tbody>${rows.map(x=>`<tr class="click" onclick="openProject('${x.project_id}')"><td>${esc(x.next_action_date||'—')}</td><td>${esc(x.projects?.name)}</td><td>${esc(x.companies?.name)}</td><td>${esc(labels[x.follow_up_type]||x.follow_up_type)}</td><td>${esc(x.result||'—')}</td><td>${esc(x.next_action||'—')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No follow-ups.</td></tr>'}</tbody></table></div>`}
async function renderCollections(){document.getElementById('content').innerHTML='<div class="empty">Loading…</div>';const {data,error}=await sb.from('projects').select('id,project_code,name,contract_value,currency,status,collections(amount)');if(error)return document.getElementById('content').innerHTML=`<div class="error">${esc(error.message)}</div>`;const won=(data||[]).filter(x=>x.status==='won'),contract=won.reduce((s,x)=>s+Number(x.contract_value||0),0),col=won.reduce((s,x)=>s+(x.collections||[]).reduce((a,c)=>a+Number(c.amount||0),0),0);document.getElementById('content').innerHTML=`<div class="grid"><div class="card"><div class="label">Contracted</div><div class="metric">${money(contract)} EGP</div></div><div class="card"><div class="label">Collected</div><div class="metric">${money(col)} EGP</div></div><div class="card"><div class="label">Remaining</div><div class="metric">${money(Math.max(0,contract-col))} EGP</div></div><div class="card"><div class="label">Won Projects</div><div class="metric">${won.length}</div></div></div><div class="table-wrap" style="margin-top:15px"><table><thead><tr><th>Code</th><th>Project</th><th>Contract</th><th>Collected</th><th>Remaining</th></tr></thead><tbody>${won.map(x=>{const c=(x.collections||[]).reduce((a,z)=>a+Number(z.amount||0),0);return `<tr class="click" onclick="openProject('${x.id}')"><td>${esc(x.project_code)}</td><td>${esc(x.name)}</td><td>${money(x.contract_value)} ${esc(x.currency)}</td><td>${money(c)} ${esc(x.currency)}</td><td>${money(Math.max(0,Number(x.contract_value||0)-c))} ${esc(x.currency)}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">No won projects yet.</td></tr>'}</tbody></table></div>`}
boot();
</script></body></html>
