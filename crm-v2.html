<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMDAD CRM V2</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f5f6f8;color:#17202a}header{background:#15191f;color:white;padding:18px 24px;display:flex;justify-content:space-between}main{max-width:1200px;margin:25px auto;padding:0 15px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:18px;margin-bottom:14px}button{padding:9px 13px;border:0;border-radius:8px;background:#c83535;color:white;cursor:pointer}button.alt{background:#eee;color:#17202a}input,select,textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tabs{display:flex;gap:6px;overflow:auto;margin:14px 0}.tabs button{background:white;color:#17202a;border:1px solid #ddd;white-space:nowrap}.tabs button.on{background:#17202a;color:white}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px}.modal>div{background:white;padding:20px;border-radius:15px;width:min(1000px,95%);max-height:90vh;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.badge{padding:4px 7px;border-radius:99px;background:#eee;font-size:11px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>EMDAD CRM V2</b><span id="who"></span></header><main><section id="login" class="card"><h2>Login</h2><input id="email" placeholder="Email"><br><br><input id="pass" type="password" placeholder="Password"><br><br><button onclick="login()">Sign in</button></section><section id="app" class="hidden"><div id="dashboard"></div><div id="projects"></div></section></main><div id="modal" class="modal hidden"><div><div style="display:flex;justify-content:space-between"><h3 id="mtitle"></h3><button class="alt" onclick="closeM()">×</button></div><div id="mbody"></div></div></div><script>
const supabase=window.supabase.createClient('https://quprtdxhjfmiodbjvrsq.supabase.co','sb_publishable_f3GJikH0CSBrX_jNIvJI6A_-oCJByhX');let me,pr,companies=[];const esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const money=x=>new Intl.NumberFormat('en-EG').format(Number(x||0));
async function login(){let {data,error}=await supabase.auth.signInWithPassword({email:email.value,password:pass.value});if(error)alert(error.message);else start(data.user)}async function start(u){me=u;loginEl.classList.add('hidden');app.classList.remove('hidden');let r=await supabase.from('profiles').select('*').eq('id',u.id).maybeSingle();pr=r.data||{full_name:u.email,role:'sales'};who.textContent=pr.full_name||u.email;render()}
const loginEl=document.getElementById('login');async function render(){let [{data:p},{data:c},{data:f}]=await Promise.all([supabase.from('projects').select('*'),supabase.from('collections').select('*'),supabase.from('follow_ups').select('*')]);let open=(p||[]).filter(x=>!['won','lost','cancelled'].includes(x.status));let sum=(a,k)=>a.reduce((s,x)=>s+Number(x[k]||0),0);dashboard.innerHTML=`<div class="grid"><div class="card"><small>Open Estimated Pipeline</small><h2>${money(sum(open,'estimated_value'))} EGP</h2></div><div class="card"><small>In Hand</small><h2>${money(sum(open.filter(x=>x.project_type==='in_hand'),'estimated_value'))} EGP</h2></div><div class="card"><small>Won / Contracted</small><h2>${money(sum((p||[]).filter(x=>x.status==='won'),'contract_value'))} EGP</h2></div><div class="card"><small>Collected</small><h2>${money(sum(c||[],'amount'))} EGP</h2></div></div><div class="card"><button onclick="newProject()">+ New Project</button> <button class="alt" onclick="loadProjects()">Projects</button></div>`;loadProjects()}
async function loadProjects(){let {data}=await supabase.from('projects').select('*,companies(name)').order('created_at',{ascending:false});projects.innerHTML=`<div class="card"><h2>Projects</h2><table><tr><th>Code</th><th>Project</th><th>Company</th><th>Type</th><th>Status</th><th>Estimated</th><th>Contract</th></tr>${(data||[]).map(x=>`<tr onclick="details('${x.id}')"><td>${esc(x.project_code)}</td><td>${esc(x.name)}</td><td>${esc(x.companies?.name)}</td><td>${esc(x.project_type)}</td><td>${esc(x.status)}</td><td>${money(x.estimated_value)}</td><td>${money(x.contract_value)}</td></tr>`).join('')}</table></div>`}
async function newProject(){let {data}=await supabase.from('companies').select('id,name').order('name');companies=data||[];openM('New Project',`<label>Name</label><input id="pn"><label>Company</label><select id="pc">${companies.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><label>Type</label><select id="pt"><option value="tender_in_market">Tender in Market</option><option value="in_hand">In Hand</option><option value="official_tender">Official Tender</option></select><label>Status</label><select id="ps"><option>new</option><option>rfq_received</option><option>sent_to_technical</option><option>technical_pricing</option><option>pricing_completed</option><option>quotation_sent</option><option>follow_up</option><option>negotiation</option><option>won</option><option>lost</option></select><label>Estimated Value (after pricing)</label><input id="ev" type="number"><label>Contract Value (Won only)</label><input id="cv" type="number"><br><br><button onclick="saveP()">Save</button>`)}
async function saveP(){let q={name:pn.value,company_id:pc.value,project_type:pt.value,status:ps.value,estimated_value:ev.value?Number(ev.value):null,contract_value:cv.value?Number(cv.value):null,sales_owner_id:me.id,created_by:me.id};let {error}=await supabase.from('projects').insert(q);if(error)alert(error.message);else{closeM();render()}}
async function details(id){let {data:p,error}=await supabase.from('projects').select('*,companies(name)').eq('id',id).single();if(error)return alert(error.message);pr=p;openM(p.name,`<b>${esc(p.project_code)}</b><p>${esc(p.companies?.name)}</p><p>Type: ${esc(p.project_type)} · Status: ${esc(p.status)}</p><div class="tabs"><button class="on" onclick="tab('technical',this)">Technical</button><button onclick="tab('quotes',this)">Quotations</button><button onclick="tab('followups',this)">Follow-ups</button><button onclick="tab('meetings',this)">Meetings</button><button onclick="tab('updates',this)">Updates</button><button onclick="tab('docs',this)">Documents</button><button onclick="tab('collections',this)">Collections</button></div><div id="body"></div>`);tab('technical',document.querySelector('.tabs button'))}
async function tab(t,b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');let cfg={technical:['technical_requests','Technical Requests',['subject','status','requested_at','completed_at','pricing_value','technical_notes']],quotes:['quotations','Quotations',['version_no','quotation_number','quotation_date','value','status','sent_at','notes']],followups:['follow_ups','Follow-ups',['follow_up_date','follow_up_type','result','next_action','next_action_date','notes']],meetings:['meetings','Meetings',['meeting_date','title','meeting_type','location','outcome','next_action']],updates:['project_updates','Updates / Revisions',['created_at','update_type','title','details']],collections:['collections','Collections',['collection_date','amount','payment_reference','notes']]}[t];if(t==='docs')return docs();let {data,error}=await supabase.from(cfg[0]).select('*').eq('project_id',pr.id).order(cfg[2][0],{ascending:false});if(error)return body.innerHTML='<p>'+esc(error.message)+'</p>';body.innerHTML=`<h3>${cfg[1]}</h3><button onclick="add('${t}')">+ Add</button><table><tr>${cfg[2].map(x=>`<th>${x}</th>`).join('')}</tr>${(data||[]).map(x=>`<tr>${cfg[2].map(k=>`<td>${esc(x[k])}</td>`).join('')}</tr>`).join('')}</table>`}
async function add(t){let forms={technical:['Technical Request','Subject','ts'],quotes:['Quotation','Quotation Number','qn'],followups:['Follow-up','Result','fr'],meetings:['Meeting','Title','mt'],updates:['Project Update','Title','ut'],collections:['Collection','Amount','ca']};let f=forms[t];openM('Add '+f[0],`<label>${f[1]}</label><input id="${f[2]}"><label>Notes</label><textarea id="an"></textarea><br><br><button onclick="saveAdd('${t}','${f[2]}')">Save</button>`)}
async function saveAdd(t,id){let map={technical:{subject:v(id),scope_notes:v('an'),project_id:pr.id,requested_by:me.id,status:'pending'},quotes:{quotation_number:v(id),notes:v('an'),project_id:pr.id,prepared_by:me.id,version_no:1,status:'draft'},followups:{result:v(id),notes:v('an'),project_id:pr.id,company_id:pr.company_id,responsible_id:me.id,follow_up_type:'phone',follow_up_date:new Date().toISOString().slice(0,10)},meetings:{title:v(id),notes:v('an'),project_id:pr.id,company_id:pr.company_id,responsible_id:me.id,meeting_date:new Date().toISOString()},updates:{title:v(id),details:v('an'),project_id:pr.id,created_by:me.id,update_type:'other'},collections:{amount:Number(v(id)||0),notes:v('an'),project_id:pr.id,collection_date:new Date().toISOString().slice(0,10),recorded_by:me.id}};let {error}=await supabase.from({technical:'technical_requests',quotes:'quotations',followups:'follow_ups',meetings:'meetings',updates:'project_updates',collections:'collections'}[t]).insert(map[t]);if(error)alert(error.message);else{closeM();details(pr.id)}}function v(id){return document.getElementById(id)?.value?.trim()||''}
async function docs(){let {data,error}=await supabase.from('project_documents').select('*').eq('project_id',pr.id).order('created_at',{ascending:false});body.innerHTML=`<h3>Documents</h3><input id="file" type="file"><br><br><button onclick="upload()">Upload</button>${error?'<p>'+esc(error.message)+'</p>':(data||[]).map(x=>`<p>${esc(x.file_name)} · ${esc(x.document_type)} <button class="alt" onclick="openFile('${esc(x.storage_path)}')">Open</button></p>`).join('')}`}
async function upload(){let f=document.getElementById('file').files[0];if(!f)return alert('Choose a file');if(f.size>50*1024*1024)return alert('Max 50 MB');let path=pr.id+'/'+Date.now()+'_'+f.name.replace(/[^a-zA-Z0-9._ -]/g,'_');let r=await supabase.storage.from('crm-documents').upload(path,f,{contentType:f.type});if(r.error)return alert(r.error.message);let q=await supabase.from('project_documents').insert({project_id:pr.id,uploaded_by:me.id,document_type:'Other',file_name:f.name,storage_path:path,version_no:1});if(q.error){await supabase.storage.from('crm-documents').remove([path]);return alert(q.error.message)}details(pr.id)}async function openFile(path){let r=await supabase.storage.from('crm-documents').createSignedUrl(path,600);if(r.error)alert(r.error.message);else window.open(r.data.signedUrl,'_blank')}
function openM(t,b){mtitle.textContent=t;mbody.innerHTML=b;modal.classList.remove('hidden')}function closeM(){modal.classList.add('hidden')}window.addEventListener('load',async()=>{let {data:{session}}=await supabase.auth.getSession();if(session)start(session.user)})
</script></body></html>
